<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="行为克隆与 DAgger 的状态分布差异">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">BC 与 DAgger：状态分布差异</text>

  <!-- left panel -->
  <rect x="32" y="72" width="420" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">BC：只在专家状态上训练</text>

  <circle cx="80" cy="300" r="6" fill="#0f172a"/>
  <text x="58" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">起点</text>

  <path d="M 80 300 C 160 260, 250 180, 380 120" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1e40af">专家轨迹</text>

  <path d="M 80 300 C 140 280, 220 250, 300 210" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="208" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#dc2626">策略漂移</text>

  <line x1="300" y1="210" x2="330" y2="245" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-r)"/>
  <text x="318" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#dc2626">偏离分布</text>

  <text x="56" y="352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">离线损失低只说明拟合了专家数据，不说明闭环能纠正误差。</text>

  <!-- right panel -->
  <rect x="468" y="72" width="420" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="492" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">DAgger：在策略状态上请求专家</text>

  <circle cx="516" cy="300" r="6" fill="#0f172a"/>
  <text x="494" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">起点</text>

  <path d="M 516 300 C 580 280, 650 250, 700 220" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="600" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5b21b6">策略 rollout</text>

  <circle cx="620" cy="284" r="4" fill="#16a34a"/>
  <circle cx="700" cy="220" r="4" fill="#16a34a"/>
  <line x1="620" y1="284" x2="680" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <line x1="700" y1="220" x2="790" y2="130" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <text x="700" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16a34a">专家纠正</text>

  <path d="M 790 130 C 820 190, 760 250, 700 220" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-g)"/>
  <text x="770" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16a34a">策略更新</text>

  <text x="492" y="352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">DAgger 需要专家在线；纠正数据先入数据集，再训练。</text>

  <rect x="32" y="398" width="856" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="418" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">评估要闭环跑任务，不能只看离线 MSE；失败样本要能回流到数据集。</text>
</svg>
