<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Sim2Real 的四类差距与对应手段">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">Sim2Real：四类差距与对应手段</text>

  <rect x="32" y="76" width="420" height="184" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1e40af">动力学</text>
  <text x="56" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">差距：质量、摩擦、阻尼、执行器延迟</text>
  <text x="56" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">手段：系统辨识、域随机化、力矩补偿</text>
  <text x="56" y="196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">接触任务里摩擦和阻尼最敏感。</text>

  <rect x="468" y="76" width="420" height="184" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="492" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#5b21b6">视觉</text>
  <text x="492" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">差距：光照、纹理、相机位姿、曝光</text>
  <text x="492" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">手段：渲染随机化、真实图像微调、相机标定</text>
  <text x="492" y="196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">合成数据的材质和反光要接近真机。</text>

  <rect x="32" y="284" width="420" height="184" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#166534">传感</text>
  <text x="56" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">差距：噪声、偏置、量化、采样延迟</text>
  <text x="56" y="376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">手段：噪声注入、滤波、传感器标定</text>
  <text x="56" y="404" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">力传感器和深度相机的噪声模型要单独建。</text>

  <rect x="468" y="284" width="420" height="184" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
  <text x="492" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#991b1b">时延</text>
  <text x="492" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">差距：推理、控制、通信、图像传输</text>
  <text x="492" y="376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">手段：动作分块、预测、延迟补偿</text>
  <text x="492" y="404" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">策略频率越低，延迟补偿越重要。</text>

  <rect x="32" y="486" width="856" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="504" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">Sim2Real 不是一次迁移，是持续校准；先消除最大 gap，再谈泛化。</text>
</svg>
