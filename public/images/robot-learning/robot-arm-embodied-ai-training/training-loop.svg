<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="具身智能训练闭环">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">具身智能训练闭环</text>

  <rect x="40" y="90" width="140" height="72" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">采集</text>
  <text x="60" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">遥操作 / 示教</text>

  <rect x="220" y="90" width="140" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">数据集</text>
  <text x="240" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">观测、动作、语言</text>

  <rect x="400" y="90" width="140" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e40af">训练</text>
  <text x="420" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">BC / RL / 微调</text>

  <rect x="580" y="90" width="140" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">仿真验证</text>
  <text x="600" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">成功率、鲁棒性</text>

  <rect x="760" y="90" width="120" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="780" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">域随机化</text>
  <text x="780" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">质量、摩擦、光照</text>

  <rect x="760" y="260" width="120" height="72" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="780" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#166534">真机部署</text>
  <text x="780" y="314" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#166534">监控、回退</text>

  <rect x="540" y="260" width="140" height="72" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#5b21b6">数据回流</text>
  <text x="560" y="314" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5b21b6">失败样本、真机数据</text>

  <rect x="320" y="260" width="140" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">评估</text>
  <text x="340" y="314" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">留出任务、新物体</text>

  <line x1="180" y1="126" x2="214" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="126" x2="394" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="126" x2="574" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="126" x2="754" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="820" y1="162" x2="820" y2="254" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="296" x2="686" y2="296" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="296" x2="466" y2="296" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-p)"/>
  <path d="M 390 260 L 390 210 L 290 210 L 290 168" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-p)"/>
  <text x="300" y="202" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6d28d9">评估后回流</text>

  <path d="M 820 90 L 820 60 L 470 60 L 470 90" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="600" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1e40af">训练时随机化</text>

  <rect x="32" y="372" width="856" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="397" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">闭环的关键是数据回流和持续评估；一次训练、一次部署不构成闭环。</text>
</svg>
