<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="逆动力学与反馈控制框图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">逆动力学与反馈回路</text>

  <!-- desired trajectory -->
  <rect x="32" y="96" width="150" height="76" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="52" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">期望轨迹</text>
  <text x="52" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">q_d, q̇_d, q̈_d</text>

  <!-- inverse dynamics -->
  <rect x="236" y="96" width="190" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="256" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e40af">逆动力学</text>
  <text x="256" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e40af">M q̈ + C q̇ + g</text>

  <!-- summing junction -->
  <circle cx="486" cy="134" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#475569">+</text>

  <!-- torque -->
  <text x="516" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">τ</text>

  <!-- robot -->
  <rect x="556" y="96" width="150" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="576" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">机械臂 / 环境</text>
  <text x="576" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">动力学与接触</text>

  <!-- sensors -->
  <rect x="746" y="96" width="122" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">传感器</text>
  <text x="766" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">q, q̇, F</text>

  <!-- arrows -->
  <line x1="182" y1="134" x2="230" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="426" y1="134" x2="462" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="504" y1="134" x2="550" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="706" y1="134" x2="740" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- external force -->
  <line x1="486" y1="230" x2="486" y2="158" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="214" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#dc2626">Jᵀ F_ext</text>

  <!-- feedback -->
  <path d="M 806 176 L 806 260 L 331 260 L 331 178" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="390" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">反馈：关节角、速度、接触力</text>

  <!-- note -->
  <rect x="32" y="300" width="836" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">两类问题</text>
  <text x="56" y="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">逆动力学：给定 q, q̇, q̈，算需要的 τ。用于前馈、力矩控制和仿真验证。</text>
  <text x="56" y="386" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">正动力学：给定 τ 和外力，算 q̈，再积分得到运动。用于仿真和模型预测。</text>
</svg>
