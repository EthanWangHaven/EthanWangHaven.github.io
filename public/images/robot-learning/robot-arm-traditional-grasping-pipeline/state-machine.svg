<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="视觉抓取状态机">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">视觉抓取状态机</text>

  <rect x="40" y="120" width="90" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="62" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e40af">IDLE</text>

  <rect x="150" y="120" width="90" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="164" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">DETECT</text>

  <rect x="260" y="120" width="90" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="280" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">PLAN</text>

  <rect x="370" y="120" width="90" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="382" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">APPROACH</text>

  <rect x="480" y="120" width="90" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">GRASP</text>

  <rect x="590" y="120" width="90" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="608" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">LIFT</text>

  <rect x="700" y="120" width="96" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="714" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155">RETREAT</text>

  <line x1="130" y1="150" x2="144" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="150" x2="254" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="150" x2="364" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="150" x2="474" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="150" x2="584" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="150" x2="694" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 748 120 L 748 84 L 85 84 L 85 114" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#16a34a">完成：回到 IDLE</text>

  <line x1="85" y1="260" x2="760" y2="260" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="100" y="286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#dc2626">任一状态超时 / 失败</text>

  <line x1="85" y1="180" x2="85" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>
  <line x1="195" y1="180" x2="195" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>
  <line x1="305" y1="180" x2="305" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>
  <line x1="415" y1="180" x2="415" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>
  <line x1="525" y1="180" x2="525" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>
  <line x1="635" y1="180" x2="635" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>
  <line x1="748" y1="180" x2="748" y2="254" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-r)"/>

  <rect x="380" y="320" width="160" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="416" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#991b1b">FAIL</text>
  <text x="416" y="370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#991b1b">记录原因</text>

  <line x1="460" y1="260" x2="460" y2="314" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <path d="M 380 352 L 30 352 L 30 150 L 38 150" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
  <text x="40" y="344" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#dc2626">复位</text>

  <rect x="32" y="430" width="856" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="454" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">失败回 IDLE 前先记录当前目标；否则重试时上下文丢失，只能重新检测。</text>
  <text x="52" y="472" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">每个状态都要有超时；抓取失败可以换候选位姿，不要原地重试。</text>
</svg>
