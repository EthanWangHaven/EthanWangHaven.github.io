<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-label="视觉抓取的时延预算">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">视觉抓取的时延预算（示意）</text>

  <rect x="40" y="130" width="77.8" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="48" y="156" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1e40af">曝光 + 传输</text>
  <text x="48" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#1e40af">50 ms</text>

  <rect x="117.8" y="130" width="77.8" height="64" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="124" y="156" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5b21b6">检测</text>
  <text x="124" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#5b21b6">50 ms</text>

  <rect x="195.6" y="130" width="62.2" height="64" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="201" y="156" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5b21b6">位姿 + TF</text>
  <text x="201" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#5b21b6">40 ms</text>

  <rect x="257.8" y="130" width="155.6" height="64" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="264" y="156" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1e40af">规划（MoveIt 2）</text>
  <text x="264" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#1e40af">100 ms</text>

  <rect x="413.3" y="130" width="311.1" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="420" y="156" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#166534">执行（规划轨迹）</text>
  <text x="420" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#166534">200 ms</text>

  <rect x="724.4" y="130" width="155.6" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="731" y="156" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#166534">夹爪闭合</text>
  <text x="731" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#166534">100 ms</text>

  <line x1="40" y1="240" x2="880" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="40" y1="232" x2="40" y2="248" stroke="#64748b" stroke-width="1.5"/>
  <line x1="880" y1="232" x2="880" y2="248" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">总时延约 540 ms（典型值，示意）</text>

  <text x="32" y="316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">时延预算按最坏情况算；抓取运动物体时，要把检测、规划和执行的时间一起补偿进去。</text>
</svg>
