<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="传统视觉抓取闭环的系统框图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">传统视觉抓取闭环：系统框图</text>

  <rect x="32" y="96" width="130" height="72" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="52" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">相机</text>
  <text x="52" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">RGB / 深度</text>

  <rect x="202" y="96" width="130" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="222" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">检测</text>
  <text x="222" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">2D 框 / 6D 位姿</text>

  <rect x="372" y="96" width="150" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="392" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">位姿变换</text>
  <text x="392" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">TF2：相机 → base</text>

  <rect x="562" y="96" width="140" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="582" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e40af">规划</text>
  <text x="582" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">MoveIt 2</text>

  <rect x="742" y="96" width="140" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="762" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">执行</text>
  <text x="762" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">ros2_control</text>

  <rect x="742" y="270" width="140" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="762" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">夹爪 / 机械臂</text>
  <text x="762" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">关节 + 夹爪</text>

  <rect x="562" y="270" width="140" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="582" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">力 / 电流</text>
  <text x="582" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">接触 / 夹持</text>

  <rect x="372" y="270" width="150" height="72" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="392" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#5b21b6">状态机</text>
  <text x="392" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5b21b6">超时 / 重试 / 回退</text>

  <rect x="202" y="270" width="130" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="222" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">日志 / 监控</text>
  <text x="222" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">失败分支</text>

  <line x1="162" y1="132" x2="196" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="166" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">/image</text>

  <line x1="332" y1="132" x2="366" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="336" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">6D</text>

  <line x1="522" y1="132" x2="556" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">T</text>

  <line x1="702" y1="132" x2="736" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">轨迹</text>

  <line x1="812" y1="168" x2="812" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="824" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">cmd</text>

  <line x1="742" y1="306" x2="708" y2="306" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">F / I</text>

  <line x1="562" y1="306" x2="528" y2="306" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">接触</text>

  <path d="M 372 306 L 340 306" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6d28d9">记录</text>

  <path d="M 447 270 L 447 210 L 632 210 L 632 174" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="470" y="202" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6d28d9">重新规划</text>

  <path d="M 632 270 L 632 230 L 800 230 L 800 174" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-r)"/>
  <text x="650" y="224" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#dc2626">超限停止</text>

  <rect x="32" y="404" width="856" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="429" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">每个箭头都是可失败点；状态机统一处理超时、重试和回退，日志记录失败分支。</text>
</svg>
