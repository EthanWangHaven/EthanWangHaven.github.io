<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="ROS 2 节点、话题、服务和动作的通信图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">ROS 2 通信模型：节点、话题、服务、动作</text>

  <rect x="56" y="100" width="140" height="76" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">相机节点</text>
  <text x="76" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">/camera</text>

  <rect x="276" y="100" width="170" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="296" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e40af">规划节点</text>
  <text x="296" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e40af">/planner</text>

  <rect x="536" y="100" width="170" height="76" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="556" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">控制节点</text>
  <text x="556" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">/controller</text>

  <rect x="766" y="100" width="124" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="786" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">机械臂</text>
  <text x="786" y="152" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">硬件接口</text>

  <rect x="56" y="286" width="170" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">状态发布</text>
  <text x="76" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">/joint_states + /tf</text>

  <rect x="306" y="286" width="170" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="326" y="316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">IK 服务</text>
  <text x="326" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">/compute_ik</text>

  <!-- topics -->
  <line x1="196" y1="138" x2="270" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">/image</text>

  <line x1="446" y1="138" x2="530" y2="138" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="460" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#111827">action</text>

  <line x1="706" y1="138" x2="760" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">write()</text>

  <!-- state feedback -->
  <line x1="226" y1="300" x2="290" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="238" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">/joint_states</text>
  <text x="150" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">/tf</text>

  <!-- service -->
  <line x1="340" y1="176" x2="370" y2="280" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="380" y="238" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6d28d9">service</text>

  <!-- legend -->
  <line x1="56" y1="420" x2="106" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="116" y="424" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">话题：持续数据流</text>
  <line x1="286" y1="420" x2="336" y2="420" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="346" y="424" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">服务：请求-应答</text>
  <line x1="526" y1="420" x2="576" y2="420" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="586" y="424" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">动作：长任务 + 反馈</text>

  <text x="56" y="468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">话题适合连续数据，服务适合短请求，动作适合可取消、带反馈的长任务。</text>
</svg>
