<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="MoveIt 2 规划管线">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">MoveIt 2 规划管线</text>

  <rect x="32" y="96" width="150" height="76" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="52" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">目标</text>
  <text x="52" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">位姿或关节目标</text>

  <rect x="222" y="96" width="170" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="242" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">规划场景</text>
  <text x="242" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">机器人 + 碰撞体</text>

  <rect x="432" y="96" width="200" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="452" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e40af">规划器</text>
  <text x="452" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1e40af">OMPL / CHOMP / TrajOpt</text>

  <rect x="672" y="96" width="216" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="692" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">轨迹后处理</text>
  <text x="692" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">时间参数化 / 平滑</text>

  <rect x="432" y="264" width="200" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="452" y="294" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">控制器</text>
  <text x="452" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">ros2_control</text>

  <rect x="672" y="264" width="216" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="692" y="294" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">机械臂 / 夹爪</text>
  <text x="692" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#334155">硬件接口</text>

  <line x1="182" y1="134" x2="216" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="392" y1="134" x2="426" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="134" x2="666" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 780 172 L 780 230 L 632 230 L 632 258" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="302" x2="666" y2="302" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 307 172 L 307 210 L 520 210 L 520 178" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="322" y="204" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6d28d9">碰撞检查</text>

  <rect x="32" y="368" width="856" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="391" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">MoveIt 2 负责“算出一条轨迹”，ros2_control 负责“按轨迹执行”；中间的接口是轨迹和控制器。</text>
</svg>
