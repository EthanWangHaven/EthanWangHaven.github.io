<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="从世界坐标系到末端和相机的变换链">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0f172a">变换链：每个箭头是一个齐次变换</text>

  <!-- world -->
  <text x="70" y="96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">world</text>
  <line x1="80" y1="150" x2="118" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="150" x2="80" y2="116" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="124" y="154" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">x</text>
  <text x="68" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">z</text>

  <line x1="130" y1="150" x2="230" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="126" y="178" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">T(world, base)</text>

  <!-- base -->
  <text x="230" y="96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">base_link</text>
  <line x1="250" y1="150" x2="288" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="150" x2="250" y2="116" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="300" y1="150" x2="400" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="296" y="178" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">T(base, link1)</text>

  <!-- link1 -->
  <text x="400" y="96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">link1</text>
  <line x1="420" y1="150" x2="458" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="150" x2="420" y2="116" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="470" y1="150" x2="570" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="178" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">T(link1, link2)</text>

  <!-- link2 -->
  <text x="570" y="96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">link2</text>
  <line x1="590" y1="150" x2="628" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="150" x2="590" y2="116" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="640" y1="150" x2="740" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="636" y="178" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">T(link2, tool)</text>

  <!-- tool -->
  <text x="740" y="96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">tool0</text>
  <line x1="760" y1="150" x2="798" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="150" x2="760" y2="116" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- camera branch -->
  <line x1="760" y1="176" x2="760" y2="236" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="772" y="212" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6d28d9">T(tool, camera)</text>

  <text x="750" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">camera_link</text>
  <line x1="760" y1="320" x2="798" y2="320" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="320" x2="760" y2="286" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- formula box -->
  <rect x="32" y="352" width="896" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0f172a">复合顺序</text>
  <text x="56" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#334155">T(world, tool) = T(world, base) · T(base, link1) · T(link1, link2) · T(link2, tool)</text>
  <text x="56" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#334155">T(world, camera) = T(world, tool) · T(tool, camera)</text>
  <text x="56" y="498" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569">左乘父变换：在基座系里表示的子变换，依次左乘到末端；顺序反了，结果就落在错误的坐标系里。</text>
</svg>
