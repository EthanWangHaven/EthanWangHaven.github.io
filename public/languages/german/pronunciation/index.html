<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deutsch Aussprache lernen!</title>
<style>
  :root {
    --bg: #FFFFFF;
    --bg-soft: #FAFAFA;
    --card: #ffffff;
    --card-border: #DDD;
    --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
    --card-shadow-hover: 0 4px 14px rgba(0,0,0,0.10);
    --ger-red: #C8102E;
    --ger-gold: #E8B400;
    --text: #1C1C1C;
    --text-soft: #6b6b6b;
    --gray: #999;
    --gray-bg: #F5F5F5;
    --highlight: #FFF5F5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Heiti SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    text-align: center;
    padding: 36px 20px 18px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
  }
  .header p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-soft);
  }

  .controls {
    max-width: 1080px;
    margin: 0 auto 14px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: var(--gray-bg);
    padding: 6px;
    border-radius: 14px;
    flex-wrap: wrap;
  }
  .tab {
    border: none;
    background: transparent;
    color: var(--gray);
    font-size: 15px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s ease;
    font-family: inherit;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--ger-red);
    color: #fff;
    box-shadow: 0 2px 8px rgba(200, 16, 46, 0.25);
  }
  .tab:not(.active):hover { color: var(--ger-red); }

  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-soft);
    user-select: none;
  }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: var(--gray);
    border-radius: 999px;
    transition: .25s;
    cursor: pointer;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: .25s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .switch input:checked + .slider { background: var(--ger-red); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .content-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 20px 40px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
  }
  .grid {
    flex: 0 1 720px;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
  }
  .content-wrap:not(.has-info) .grid { flex-basis: 720px; }

  .info-panel {
    width: 320px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    padding: 24px 20px;
    min-height: 380px;
    transition: opacity .25s ease, transform .25s ease;
  }
  .info-panel.hidden {
    display: none;
  }
  .info-panel .ip-placeholder {
    text-align: center;
    color: var(--gray);
    font-size: 14px;
    padding-top: 120px;
    line-height: 2;
  }
  .info-panel .ip-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap;
  }
  .info-panel .ip-main {
    font-size: 40px;
    color: var(--text);
    line-height: 1.1;
    word-break: break-word;
  }
  .info-panel .ip-ipa {
    font-size: 18px;
    color: var(--text-soft);
  }
  .info-panel .ip-section { margin-bottom: 16px; }
  .info-panel .ip-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ger-red);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-panel .ip-label::before {
    content: "";
    width: 3px; height: 12px;
    background: var(--ger-gold);
    border-radius: 2px;
  }
  .info-panel .ip-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }
  .info-panel .ip-words {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .info-panel .ip-word {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
  }
  .info-panel .ip-word .w-de {
    color: var(--ger-red);
    font-weight: 600;
    min-width: 70px;
  }
  .info-panel .ip-word .w-cn {
    color: var(--text-soft);
    margin-left: auto;
  }
  .info-panel .ip-word.word-highlight {
    animation: wordPop 0.5s ease;
  }
  .info-panel .ip-word.word-highlight .w-de {
    color: var(--ger-gold);
  }
  @keyframes wordPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .btn-readall {
    border: none;
    background: var(--ger-red);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-readall:hover { background: #a00d24; }
  .btn-readall.reading {
    background: var(--gray);
    cursor: not-allowed;
    opacity: 0.6;
  }
  .btn-readall .play-ico {
    width: 0; height: 0;
    border-left: 7px solid #fff;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }

  .card.hovered {
    border-color: var(--ger-red);
    box-shadow: 0 0 0 2px rgba(200, 16, 46, 0.15), var(--card-shadow-hover);
  }

  .card {
    background: #FFFCE8;
    border: 1px solid var(--ger-gold);
    border-radius: 18px;
    padding: 18px 10px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .card:hover {
    box-shadow: var(--card-shadow-hover);
    transform: translateY(-2px);
  }
  .card.active {
    transform: scale(0.94);
    background: var(--highlight);
    box-shadow: var(--card-shadow-hover);
  }
  .de-main {
    line-height: 1.1;
    color: var(--text);
  }
  .card.alpha-card .de-main {
    font-size: 38px;
  }
  .card.spell-card .de-main {
    font-size: 20px;
    word-break: break-word;
  }
  .de-sub {
    font-size: 22px;
    color: var(--text-soft);
    transition: opacity .2s ease, height .2s ease, margin .2s ease;
  }
  .de-ipa {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--gray);
    transition: opacity .2s ease, height .2s ease, margin .2s ease;
  }
  .de-desc {
    font-size: 13px;
    color: var(--text-soft);
  }
  body.hide-ipa .de-ipa {
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
  }

  .row-label {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--text-soft);
    margin: 14px 0 -4px 2px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row-label::before {
    content: "";
    width: 4px; height: 14px;
    background: var(--ger-gold);
    border-radius: 2px;
  }

  .empty {
    text-align: center;
    color: var(--gray);
    padding: 40px;
  }

  .voice-tip {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .voice-tip .tip-box {
    display: none;
    margin-top: 4px;
    padding: 8px 14px;
    font-size: 12px;
    color: #8a6d3b;
    background: #fdf6e3;
    border: 1px solid #f0e3c2;
    border-radius: 10px;
  }

  body.write-mode .de-main,
  body.write-mode .de-sub,
  body.write-mode .de-ipa,
  body.write-mode .de-desc { opacity: 0; }
  body.write-mode .card:hover .de-main,
  body.write-mode .card:hover .de-sub,
  body.write-mode .card:hover .de-ipa,
  body.write-mode .card:hover .de-desc { opacity: 0; }

  @media (max-width: 600px) {
    .header h1 { font-size: 23px; }
    .content-wrap { padding: 10px 14px 40px; }
    .grid { flex-basis: 100% !important; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .card.alpha-card .de-main { font-size: 32px; }
    .card.spell-card .de-main { font-size: 17px; }
    .de-sub { font-size: 18px; }
    .controls { padding: 0 14px; }
    .tab { padding: 8px 12px; font-size: 14px; }
  }

  .back-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: #fff;
    border: 1px solid var(--ger-red, #C8102E);
    border-radius: 20px;
    color: var(--ger-red, #C8102E);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    transition: background .2s ease, color .2s ease;
  }
  .back-btn:hover {
    background: var(--ger-red, #C8102E);
    color: #fff;
  }
</style>
</head>
<body>
  <button class="back-btn" onclick="history.back()">&larr; Zurück</button>
  <header class="header">
    <h1>Deutsch Aussprache lernen!</h1>
    <p>Deutsch Aussprache meistern, natürlich und präzise sprechen</p>
  </header>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="alphabet">字母表</button>
      <button class="tab" data-tab="vokale">单元音</button>
      <button class="tab" data-tab="konsonanten">辅音</button>
      <button class="tab" data-tab="diphthonge">复合元音</button>
      <button class="tab" data-tab="konsonantenverbindungen">辅音组合</button>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <label class="switch-wrap">
        <span>显示IPA</span>
        <span class="switch">
          <input type="checkbox" id="ipaToggle" checked />
          <span class="slider"></span>
        </span>
      </label>
      <label class="switch-wrap">
        <span>悬停详情</span>
        <span class="switch">
          <input type="checkbox" id="infoToggle" checked />
          <span class="slider"></span>
        </span>
      </label>
      <label class="switch-wrap">
        <span>默写模式</span>
        <span class="switch">
          <input type="checkbox" id="writeToggle" />
          <span class="slider"></span>
        </span>
      </label>
      <button class="btn-readall" id="btnReadAll">
        <span class="play-ico"></span>连读
      </button>
    </div>
  </div>

  <div class="voice-tip">
    <div class="tip-box" id="voiceTip"></div>
  </div>

  <div class="content-wrap has-info" id="contentWrap">
    <main class="grid" id="grid"></main>
    <aside class="info-panel" id="infoPanel">
      <div class="ip-placeholder">将鼠标悬停在卡片上<br>查看详细信息</div>
    </aside>
  </div>

const DATA = {

      { letter: "Ö", lower: "ö", ipa: "[øː]", speak: "Ö", info: "嘴唇圆撮发e的音", examples: [["öde","荒凉的"],["Höhe","高度"]] },

      { spell: "ä, äh", ipa: "[ɛː]", desc: "长音", speak: "Nähe", info: "嘴角微展，发长ɛ音", examples: [["Häfen","港口"],["Nähe","附近"]] },

      { spell: "ü, y", ipa: "[ʏ]", desc: "短音", speak: "fünf", info: "嘴唇圆撮发短i的音", examples: [["fünf","五"],["Typ","类型"]] }

let currentTab = "alphabet";
const grid = document.getElementById("grid");

function render(tab) {
  grid.innerHTML = "";
  const groups = DATA[tab];
  if (!groups) { grid.innerHTML = "<div class='empty'>暂无数据</div>"; return; }
  const isAlpha = (tab === "alphabet");
  groups.forEach(group => {
    const label = document.createElement("div");
    label.className = "row-label";
    label.textContent = group.row;
    grid.appendChild(label);
    group.items.forEach(item => {
      const card = document.createElement("div");
      card.className = isAlpha ? "card alpha-card" : "card spell-card";
      card._item = item;
      if (isAlpha) {
        card.innerHTML =
          "<div class='de-main'>" + item.letter + "</div>" +
          "<div class='de-sub'>" + item.lower + "</div>" +
          "<div class='de-ipa'>" + item.ipa + "</div>";
      } else {
        card.innerHTML =
          "<div class='de-main'>" + item.spell + "</div>" +
          "<div class='de-ipa'>" + item.ipa + "</div>" +
          "<div class='de-desc'>" + item.desc + "</div>";
      }
      card.addEventListener("click", () => speakCard(card, item.speak || item.letter));
      card.addEventListener("mouseenter", () => showInfo(card));
      grid.appendChild(card);
    });
  });
}

/* ============ 信息面板 ============ */
const infoPanel = document.getElementById("infoPanel");
const contentWrap = document.getElementById("contentWrap");
let infoEnabled = true;

function showInfo(card) {
  if (!infoEnabled) return;
  if (document.body.classList.contains("write-mode")) return;
  document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
  card.classList.add("hovered");

  const item = card._item;
  if (!item) return;

  const isAlpha = !!item.letter;
  const mainText = isAlpha ? item.letter : item.spell;

  let wordsHTML = "";
  if (item.examples && item.examples.length) {
    wordsHTML = item.examples.map(w =>
      "<div class='ip-word' data-word='" + w[0] + "'><span class='w-de'>" + w[0] + "</span><span class='w-cn'>" + w[1] + "</span></div>"
    ).join("");
  }

  infoPanel.innerHTML =
    "<div class='ip-header'>" +
      "<span class='ip-main'>" + mainText + "</span>" +
      "<span class='ip-ipa'>" + item.ipa + "</span>" +
    "</div>" +
    "<div class='ip-section'><div class='ip-label'>发音说明</div><div class='ip-text'>" + item.info + "</div></div>" +
    (wordsHTML ? "<div class='ip-section'><div class='ip-label'>例词</div><div class='ip-words'>" + wordsHTML + "</div></div>" : "");
}

/* ============ 本地音频播放 ============ */
const voiceTip = document.getElementById("voiceTip");
let currentAudio = null;

  "A": "alpha_a", "B": "alpha_b", "C": "alpha_c", "D": "alpha_d",

function speak(text) {
  const fileKey = AUDIO_MAP[text] || text;
  const url = "audio/" + fileKey + ".mp3";
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  currentAudio = new Audio(url);
  currentAudio.play().catch(err => {
    voiceTip.style.display = "block";
    voiceTip.textContent = "音频加载失败：" + text + " (" + err.message + ")";
  });
}

function speakCard(card, text) {
  card.classList.add("active");
  setTimeout(() => card.classList.remove("active"), 260);
  try {
    speak(text);
    highlightExampleWord(text);
  } catch (e) {
    voiceTip.style.display = "block";
    voiceTip.textContent = "播放出错：" + e.message;
  }
}

/* 高亮正在朗读的例词 */
function highlightExampleWord(text) {
  document.querySelectorAll(".ip-word.word-highlight").forEach(w => {
    w.classList.remove("word-highlight");
  });
  const item = document.querySelector(".card.hovered");
  if (!item) return;
  const examples = item._item && item._item.examples;
  if (!examples) return;
  const match = examples.find(w => w[0] === text);
  if (!match) return;
  const wordEl = infoPanel.querySelector(".ip-word[data-word='" + text + "']");
  if (wordEl) {
    wordEl.classList.add("word-highlight");
    setTimeout(() => wordEl.classList.remove("word-highlight"), 600);
  }
}

/* ============ 交互绑定 ============ */
const btnReadAll = document.getElementById("btnReadAll");
let isReading = false;

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.tab;
    render(currentTab);
    if (isReading) stopReadAll();
  });
});

document.getElementById("ipaToggle").addEventListener("change", e => {
  document.body.classList.toggle("hide-ipa", !e.target.checked);
});

document.getElementById("infoToggle").addEventListener("change", e => {
  infoEnabled = e.target.checked;
  if (infoEnabled) {
    infoPanel.classList.remove("hidden");
    contentWrap.classList.add("has-info");
  } else {
    infoPanel.classList.add("hidden");
    contentWrap.classList.remove("has-info");
    document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
  }
});

document.getElementById("writeToggle").addEventListener("change", e => {
  document.body.classList.toggle("write-mode", e.target.checked);
  if (e.target.checked) {
    document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
    if (infoPanel) infoPanel.innerHTML = "<div class='ip-placeholder'>默写模式已开启<br>卡片内容已隐藏</div>";
  }
});

/* ============ 连读功能 ============ */
function playOne(text) {
  return new Promise(resolve => {
    const fileKey = AUDIO_MAP[text] || text;
    const audio = new Audio("audio/" + fileKey + ".mp3");
    audio.addEventListener("ended", resolve);
    audio.addEventListener("error", resolve);
    audio.play().catch(resolve);
  });
}

async function startReadAll() {
  if (isReading) return;
  isReading = true;
  btnReadAll.classList.add("reading");
  btnReadAll.innerHTML = "<span class='play-ico'></span>朗读中...";
  const cards = [...document.querySelectorAll("#grid .card")];
  for (let i = 0; i < cards.length; i++) {
    if (!isReading) break;
    const card = cards[i];
    card.classList.add("hovered");
    showInfo(card);
    const item = card._item;
    const speakText = item.speak || item.letter;
    highlightExampleWord(speakText);
    await playOne(speakText);
    card.classList.remove("hovered");
  }
  isReading = false;
  btnReadAll.classList.remove("reading");
  btnReadAll.innerHTML = "<span class='play-ico'></span>连读";
}

function stopReadAll() {
  isReading = false;
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  btnReadAll.classList.remove("reading");
  btnReadAll.innerHTML = "<span class='play-ico'></span>连读";
  document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
}

btnReadAll.addEventListener("click", () => {
  if (isReading) stopReadAll(); else startReadAll();
});

render(currentTab);
