<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英语阅读 · Reading</title>
<link rel="stylesheet" href="../../shared-theme.css" />
<style>
  :root {
    --en-blue: #2E7BC0;
    --en-blue-light: #EBF3FA;
  }
  .dark { --en-blue-light: rgba(46, 123, 192, 0.15); }
  .flag-stripe { display: flex; height: 3px; width: 100%; }
  .stripe-blue { flex: 1; background: var(--en-blue); }
  .header h1 .en-accent { color: var(--en-blue); }
  .wrap { max-width: 800px; }
  .passage-list { display: flex; flex-direction: column; gap: 16px; }
  .passage-card { background: var(--glass-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 28px 32px; transition: border-color .2s, box-shadow .2s; }
  .passage-card:hover { border-color: var(--en-blue); box-shadow: var(--shadow-hover); }
  .passage-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--en-blue-light); }
  .passage-content { font-size: 16px; color: var(--text); line-height: 1.9; text-align: justify; }
  .passage-content::first-letter { font-size: 1.2em; font-weight: 700; }
</style>
</head>
<body>
<button class="theme-toggle-lang" onclick="document.documentElement.classList.toggle('dark')" aria-label="Toggle theme">
  <span class="icon-sun">☀️</span>
  <span class="icon-moon">🌙</span>
</button>
<div class="flag-stripe"><div class="stripe-blue"></div></div>

<div class="header">
  <h1>英语<span class="en-accent">阅读</span></h1>
  <p>短篇阅读练习</p>
</div>

<div class="wrap">
  <a href="/languages/" class="back-link">&larr; 返回 Languages</a>
  <div class="passage-list" id="passageList"></div>
</div>

<script src="data.js"></script>
<script>
(function() {
  var passages = (typeof READING_DATA !== 'undefined') ? READING_DATA.passages : [];
  var list = document.getElementById('passageList');

  if (passages.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无阅读内容</div>';
    return;
  }

  list.innerHTML = passages.map(function(p) {
    return '<div class="passage-card">' +
      '<h2 class="passage-title">' + escapeHtml(p.title) + '</h2>' +
      '<div class="passage-content">' + escapeHtml(p.content) + '</div>' +
    '</div>';
  }).join('');

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
<script>
(function(){var t=localStorage.getItem('lang-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}var btn=document.querySelector('.theme-toggle-lang');if(btn){btn.addEventListener('click',function(){var isDark=document.documentElement.classList.toggle('dark');localStorage.setItem('lang-theme',isDark?'dark':'light')})}})();
</script>
</body>
</html>
