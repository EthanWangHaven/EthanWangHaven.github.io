<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英语阅读 · Reading</title>
<style>
  :root {
    --bg: #FFFFFF;
    --text: #1C1C1C;
    --text-soft: #6b6b6b;
    --border: #DDD;
    --border-light: #EEE;
    --en-blue: #2E7BC0;
    --en-blue-light: #EBF3FA;
    --en-blue-dark: #1B5C99;
    --gray: #999;
    --gray-bg: #F5F5F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.8;
  }

  .flag-stripe { display: flex; height: 3px; width: 100%; }
  .stripe-blue { flex: 1; background: var(--en-blue); }

  .header { text-align: center; padding: 28px 20px 10px; }
  .header h1 { font-size: 26px; font-weight: 700; color: var(--text); }
  .header h1 .en-accent { color: var(--en-blue); }
  .header p { margin-top: 6px; font-size: 13px; color: var(--text-soft); }

  .wrap { max-width: 800px; margin: 0 auto; padding: 16px 20px 60px; }

  .back-link {
    display: inline-block; margin-bottom: 12px;
    font-size: 13px; color: var(--en-blue); text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  /* 文章列表 */
  .passage-list { display: flex; flex-direction: column; gap: 16px; }
  .passage-card {
    background: #fff; border: 1px solid var(--border-light); border-radius: 12px;
    padding: 28px 32px; transition: border-color .2s, box-shadow .2s;
  }
  .passage-card:hover { border-color: var(--en-blue); box-shadow: 0 2px 10px rgba(46,123,192,0.08); }
  .passage-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 2px solid var(--en-blue-light);
  }
  .passage-content {
    font-size: 16px; color: #333; line-height: 1.9;
    text-align: justify;
  }
  .passage-content::first-letter {
    font-size: 1.2em; font-weight: 700;
  }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--gray); font-size: 14px; }
</style>
</head>
<body>
<div class="flag-stripe"><div class="stripe-blue"></div></div>

<div class="header">
  <h1>英语<span class="en-accent">阅读</span></h1>
  <p>短篇阅读练习</p>
</div>

<div class="wrap">
  <a href="/languages/" class="back-link">&larr; 返回 Languages</a>
  <div class="passage-list" id="passageList"></div>
</div>

<script src="data.js"></script>
<script>
(function() {
  var passages = (typeof READING_DATA !== 'undefined') ? READING_DATA.passages : [];
  var list = document.getElementById('passageList');

  if (passages.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无阅读内容</div>';
    return;
  }

  list.innerHTML = passages.map(function(p) {
    return '<div class="passage-card">' +
      '<h2 class="passage-title">' + escapeHtml(p.title) + '</h2>' +
      '<div class="passage-content">' + escapeHtml(p.content) + '</div>' +
    '</div>';
  }).join('');

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
