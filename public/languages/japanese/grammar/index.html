<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本語文法ラーニング</title>
<style>
  :root {
    --bg: #ECF7EF;
    --bg-soft: #f5fbf8;
    --card: #FFFFFF;
    --card-border: #d8ece4;
    --card-shadow: 0 4px 14px rgba(120,180,150,0.12);
    --card-shadow-hover: 0 8px 24px rgba(120,180,150,0.22);
    --mint: #6fc6a4;
    --mint-light: #e3f3ec;
    --mint-deep: #408C60;
    --mint-dark: #357a52;
    --text: #2c3333;
    --text-soft: #647474;
    --gray: #9bb0a7;
    --gray-bg: #eef3f0;
    --highlight: #2A8C78;
    --highlight-bg: #eaf6f1;
    --warn: #d16060;
    --warn-bg: #fdeeee;
    --warn-border: #f0d0d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Heiti SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  .jp-font {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
  }

  .header { text-align: center; padding: 40px 20px 20px; }
  .header h1 { font-size: 30px; font-weight: 700; color: var(--mint-deep); letter-spacing: 1px; }
  .header p { margin-top: 8px; font-size: 14px; color: var(--text-soft); }

  .view { display: none; animation: fade .3s ease; }
  .view.active { display: block; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .overview-wrap { max-width: 980px; margin: 0 auto; padding: 20px 20px 60px; }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
    margin-top: 18px;
  }
  .level-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 28px 18px 24px;
    text-align: center;
    box-shadow: var(--card-shadow);
    transition: transform .18s ease, box-shadow .2s ease;
    position: relative;
  }
  .level-card.available { cursor: pointer; }
  .level-card.available:hover {
    transform: translateY(-4px);
    box-shadow: var(--card-shadow-hover);
    border-color: var(--mint);
  }
  .level-card.locked { opacity: .62; cursor: not-allowed; }
  .level-card .lv-badge {
    display: inline-block; font-size: 13px; font-weight: 700;
    color: #fff; background: var(--mint-deep);
    padding: 4px 16px; border-radius: 999px; margin-bottom: 14px; letter-spacing: 1px;
  }
  .level-card.locked .lv-badge { background: var(--gray); }
  .level-card .lv-name { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .level-card .lv-desc { font-size: 12px; color: var(--text-soft); }
  .level-card .lv-count { margin-top: 10px; font-size: 12px; color: var(--mint-deep); font-weight: 600; }
  .level-card.locked .lv-count { color: var(--gray); }
  .level-card .lv-soon {
    margin-top: 8px; font-size: 12px; color: var(--gray);
    background: var(--gray-bg); padding: 3px 10px; border-radius: 8px; display: inline-block;
  }

  .catalog-wrap { max-width: 980px; margin: 0 auto; padding: 10px 20px 60px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); margin-bottom: 16px; }
  .breadcrumb a { color: var(--mint-deep); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--gray); }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filter-tag {
    border: none; background: var(--gray-bg); color: var(--text-soft);
    font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 10px;
    cursor: pointer; transition: all .2s ease; font-family: inherit;
  }
  .filter-tag:hover { color: var(--mint-deep); }
  .filter-tag.active { background: var(--mint-deep); color: #fff; box-shadow: 0 4px 12px rgba(64,140,96,0.3); }

  .grammar-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .grammar-item {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 16px 18px; cursor: pointer; box-shadow: var(--card-shadow);
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    display: flex; align-items: center; gap: 14px;
  }
  .grammar-item:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-hover); border-color: var(--mint); }
  .grammar-item .gi-num {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
    background: var(--mint-light); color: var(--mint-deep);
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .grammar-item .gi-body { flex: 1; min-width: 0; }
  .grammar-item .gi-name { font-size: 18px; font-weight: 600; color: var(--mint-deep); }
  .grammar-item .gi-name .cat-pill {
    font-size: 11px; font-weight: 600; color: var(--text-soft);
    background: var(--gray-bg); padding: 2px 8px; border-radius: 6px; margin-left: 8px; vertical-align: middle;
  }
  .grammar-item .gi-meaning {
    font-size: 13px; color: var(--text-soft); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .detail-wrap { max-width: 1080px; margin: 0 auto; padding: 10px 20px 60px; display: flex; gap: 24px; align-items: flex-start; }
  .detail-main { flex: 1; min-width: 0; }
  .detail-side { width: 300px; flex-shrink: 0; position: sticky; top: 20px; }

  .detail-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 18px;
    box-shadow: var(--card-shadow); padding: 26px 28px; margin-bottom: 18px;
  }
  .detail-title {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
  }
  .detail-title .dt-name { font-size: 30px; font-weight: 700; color: var(--mint-deep); line-height: 1.1; }
  .detail-title .dt-tags { display: flex; flex-direction: column; gap: 6px; margin-left: auto; align-items: flex-end; }
  .tag-pill { font-size: 11px; font-weight: 600; padding: 3px 12px; border-radius: 999px; }
  .tag-level { background: var(--mint-deep); color: #fff; }
  .tag-cat { background: var(--mint-light); color: var(--mint-deep); }

  .section-label {
    font-size: 13px; font-weight: 600; color: var(--mint-deep); margin-bottom: 8px;
    display: flex; align-items: center; gap: 7px;
  }
  .section-label::before { content: ""; width: 4px; height: 14px; background: var(--mint); border-radius: 2px; }
  .detail-section { margin-bottom: 22px; }
  .detail-section:last-child { margin-bottom: 0; }
  .section-text { font-size: 14px; line-height: 1.75; color: var(--text); }
  .section-text-soft { font-size: 14px; line-height: 1.75; color: var(--text-soft); }

  .conn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .conn-cell { background: var(--highlight-bg); border: 1px solid #c8e8df; border-radius: 12px; padding: 10px 14px; }
  .conn-cell .cc-label { font-size: 12px; font-weight: 600; color: var(--highlight); margin-bottom: 3px; }
  .conn-cell .cc-value { font-size: 14px; color: var(--text); }
  .conn-cell .cc-value.dash { color: var(--gray); }

  .pitfall-box {
    background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 12px;
    padding: 12px 16px; font-size: 14px; line-height: 1.7; color: #a14a4a;
  }
  .pitfall-box::before { content: "\26A0  "; color: var(--warn); font-weight: 700; }

  .similar-list { display: flex; flex-direction: column; gap: 10px; }
  .similar-row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 14px; background: var(--bg-soft); border: 1px solid var(--card-border); border-radius: 12px;
  }
  .similar-row .sr-name { flex-shrink: 0; font-size: 16px; font-weight: 700; color: var(--highlight); min-width: 56px; }
  .similar-row .sr-desc { font-size: 13px; color: var(--text-soft); line-height: 1.6; }

  .example-list { display: flex; flex-direction: column; gap: 12px; }
  .example-item { padding: 12px 16px; background: var(--bg-soft); border-radius: 12px; border-left: 3px solid var(--mint); }
  .example-jp { font-size: 17px; line-height: 2; color: var(--text); margin-bottom: 4px; }
  .example-jp ruby { ruby-position: over; }
  .example-jp rt { font-size: 11px; color: var(--text-soft); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif; }
  .example-cn { font-size: 13px; color: var(--text-soft); }

  .side-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 18px;
    box-shadow: var(--card-shadow); padding: 22px 20px; margin-bottom: 16px;
  }
  .side-quick { font-size: 13px; line-height: 1.9; color: var(--text); }
  .side-quick .sq-row { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px dashed var(--card-border); }
  .side-quick .sq-row:last-child { border-bottom: none; }
  .side-quick .sq-label { flex-shrink: 0; color: var(--highlight); font-weight: 600; min-width: 48px; }
  .side-quick .sq-val.dash { color: var(--gray); }

  .side-nav { display: flex; gap: 10px; }
  .side-nav button {
    flex: 1; border: 1px solid var(--card-border); background: var(--card); color: var(--text);
    font-size: 13px; font-weight: 600; padding: 10px 8px; border-radius: 12px;
    cursor: pointer; transition: all .2s ease; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .side-nav button:hover:not(:disabled) { background: var(--mint-light); border-color: var(--mint); color: var(--mint-deep); }
  .side-nav button:disabled { opacity: .4; cursor: not-allowed; }
  .side-nav button .nav-label { font-size: 11px; color: var(--text-soft); }
  .side-nav button .nav-name { font-size: 15px; }

  .side-similar-link {
    display: block; padding: 8px 12px; background: var(--bg-soft);
    border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 8px;
    cursor: pointer; transition: all .2s ease;
  }
  .side-similar-link:hover { background: var(--mint-light); border-color: var(--mint); }
  .side-similar-link .ssl-name { font-size: 15px; font-weight: 600; color: var(--highlight); }
  .side-similar-link .ssl-desc { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--card-border); background: var(--card); color: var(--text-soft);
    font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 10px;
    cursor: pointer; transition: all .2s ease; font-family: inherit; margin-bottom: 16px;
  }
  .back-btn:hover { background: var(--mint-light); border-color: var(--mint); color: var(--mint-deep); }

  .empty { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 14px; }

  @media (max-width: 760px) {
    .header h1 { font-size: 24px; }
    .detail-wrap { flex-direction: column; }
    .detail-side { width: 100%; position: static; }
    .conn-grid { grid-template-columns: 1fr; }
    .level-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (max-width: 480px) {
    .detail-card { padding: 20px 18px; }
    .detail-title .dt-name { font-size: 26px; }
  }
</style>
</head>
<body>
  <a href="/languages/" id="fixedBackBtn" class="back-btn" style="position:fixed;top:1rem;left:1rem;z-index:9999;display:inline-flex;align-items:center;gap:0.35rem;padding:0.5rem 1rem;background:#fff;border:1.5px solid var(--mint-deep);border-radius:8px;color:var(--mint-deep);text-decoration:none;font-size:0.9rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:all 0.2s ease;cursor:pointer;">&larr; 戻る</a>
  <header class="header">
    <h1>日本語文法ラーニング</h1>
  </header>

  <section class="view active" id="viewOverview">
    <div class="overview-wrap">
      <div class="level-grid" id="levelGrid"></div>
    </div>
  </section>

  <section class="view" id="viewCatalog">
    <div class="catalog-wrap">
      <div class="breadcrumb">
        <a id="bcHome1">首页</a>
        <span class="sep">/</span>
        <span id="bcLevel1">N5 语法</span>
      </div>
      <div class="filter-bar" id="filterBar"></div>
      <div class="grammar-list" id="grammarList"></div>
    </div>
  </section>

  <section class="view" id="viewDetail">
    <div class="detail-wrap">
      <div class="detail-main" id="detailMain"></div>
      <aside class="detail-side" id="detailSide"></aside>
    </div>
  </section>

<script>
var GRAMMAR_DATA = [
  {
    id: "n5-01",
    level: "N5",
    category: "助词",
    name: "は",
    meaning: "提示句子的主题，强调主题后面的内容（'～的话，是…'）",
    connection: { noun: "名词 + は", verb: "—", i_adj: "—", na_adj: "な形容词词干 + は" },
    scene: "口语、书面均可，最基础的主题提示助词",
    pitfalls: "は强调的是后面的内容（谓语），而が强调的是前面的主语，二者不要混淆。は还可用于对比。",
    similar: [{ name: "が", desc: "提示主语，强调前面的对象" }],
    examples: [
      { jp: "私は学生です", ruby: [{base:"私",text:"わたし"},{base:"学生",text:"がくせい"}], cn: "我是学生" },
      { jp: "これは本ではありません", ruby: [{base:"本",text:"ほん"}], cn: "这个不是书" }
    ]
  },
  {
    id: "n5-02",
    level: "N5",
    category: "助词",
    name: "が",
    meaning: "提示主语，强调前面的对象；也用于表示能力、好恶的对象",
    connection: { noun: "名词 + が", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可，强调'是谁/什么'在做",
    pitfalls: "が强调的是它前面的主语，は强调的是它后面的内容。疑问词后必须用が，不能用は。",
    similar: [{ name: "は", desc: "提示主题，强调后面的内容" }],
    examples: [
      { jp: "猫がいます", ruby: [{base:"猫",text:"ねこ"}], cn: "有猫" },
      { jp: "誰が来ましたか", ruby: [{base:"誰",text:"だれ"},{base:"来",text:"き"}], cn: "谁来了？" }
    ]
  },
  {
    id: "n5-03",
    level: "N5",
    category: "助词",
    name: "を",
    meaning: "提示他动词的宾语，表示动作的直接对象",
    connection: { noun: "名词 + を + 他动词", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可，用于动作对象",
    pitfalls: "を只能接在他动词前，不能用于自动词。移动动词经过的场所也可用を（如：道を歩く）。",
    similar: [{ name: "が", desc: "提示主语，自动词前用が" }],
    examples: [
      { jp: "ご飯を食べます", ruby: [{base:"ご飯",text:"ごはん"},{base:"食",text:"た"}], cn: "吃饭" },
      { jp: "本を読みます", ruby: [{base:"本",text:"ほん"},{base:"読",text:"よ"}], cn: "读书" }
    ]
  },
  {
    id: "n5-04",
    level: "N5",
    category: "助词",
    name: "に",
    meaning: "表示时间、场所、目的地、对象、目的等多种含义",
    connection: { noun: "名词 + に", verb: "动词辞书形 + に", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可，N5最高频多功能助词",
    pitfalls: "具体时间点用に，相对时间（今日、明日等）不用に。に还可表示目的（〜に行く）。",
    similar: [{ name: "へ", desc: "仅表示方向/目的地" }],
    examples: [
      { jp: "七時に起きます", ruby: [{base:"七時",text:"しちじ"},{base:"起",text:"お"}], cn: "七点起床" },
      { jp: "学校に行きます", ruby: [{base:"学校",text:"がっこう"},{base:"行",text:"い"}], cn: "去学校" }
    ]
  },
  {
    id: "n5-05",
    level: "N5",
    category: "助词",
    name: "で",
    meaning: "表示动作进行的场所、手段、方法、范围等",
    connection: { noun: "名词 + で", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可，表示'在某地做某事'或'用…做'",
    pitfalls: "で表示动作场所（在那里做什么），に表示存在场所（在那里有什么）。注意区分。",
    similar: [{ name: "に", desc: "表示存在/到达地点" }],
    examples: [
      { jp: "図書館で勉強します", ruby: [{base:"図書館",text:"としょかん"},{base:"勉強",text:"べんきょう"}], cn: "在图书馆学习" },
      { jp: "箸で食べます", ruby: [{base:"箸",text:"はし"},{base:"食",text:"た"}], cn: "用筷子吃" }
    ]
  },
  {
    id: "n5-06",
    level: "N5",
    category: "助词",
    name: "と",
    meaning: "表示并列（和）、共同动作的对象、引用内容",
    connection: { noun: "名词 + と + 名词", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可",
    pitfalls: "と表示完全列举（只有这些），や表示不完全列举（还有别的）。と还用于'和某人一起做'。",
    similar: [{ name: "や", desc: "不完全列举，暗示还有其他" }],
    examples: [
      { jp: "りんごとみかんを買います", ruby: [{base:"買",text:"か"}], cn: "买苹果和橘子" },
      { jp: "友達と映画を見ます", ruby: [{base:"友達",text:"ともだち"},{base:"映画",text:"えいが"},{base:"見",text:"み"}], cn: "和朋友一起看电影" }
    ]
  },
  {
    id: "n5-07",
    level: "N5",
    category: "助词",
    name: "も",
    meaning: "表示'也'，追加同类事物",
    connection: { noun: "名词 + も", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可",
    pitfalls: "用も时前面的助词（は/が/を）要去掉。も还可以接否定表示'也不'（〜も〜ない）。",
    similar: [{ name: "は", desc: "提示主题，不表示追加" }],
    examples: [
      { jp: "私も学生です", ruby: [{base:"私",text:"わたし"},{base:"学生",text:"がくせい"}], cn: "我也是学生" },
      { jp: "何もありません", ruby: [{base:"何",text:"なに"}], cn: "什么也没有" }
    ]
  },
  {
    id: "n5-08",
    level: "N5",
    category: "助词",
    name: "の",
    meaning: "名词修饰名词（所属/属性），或做形式名词指代",
    connection: { noun: "名词 + の + 名词", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可，最常用修饰助词",
    pitfalls: "'AのB'中A修饰B，方向是A到B。'この/その/あの'后面必须有名词，不能单独使用。",
    similar: [{ name: "が", desc: "が也可做主语修饰名词（私が買った本）" }],
    examples: [
      { jp: "私の本です", ruby: [{base:"私",text:"わたし"},{base:"本",text:"ほん"}], cn: "这是我的书" },
      { jp: "日本語の先生", ruby: [{base:"日本語",text:"にほんご"},{base:"先生",text:"せんせい"}], cn: "日语老师" }
    ]
  },
  {
    id: "n5-09",
    level: "N5",
    category: "助词",
    name: "へ",
    meaning: "表示移动的方向或目的地",
    connection: { noun: "名词 + へ", verb: "—", i_adj: "—", na_adj: "—" },
    scene: "口语、书面均可，用于移动动词前",
    pitfalls: "へ只用于移动方向（行く/来る/帰る等），在表示目的地时へ和に基本可互换，但へ更强调方向。",
    similar: [{ name: "に", desc: "に用途更广，可表时间/目的/存在" }],
    examples: [
      { jp: "右へ曲がってください", ruby: [{base:"右",text:"みぎ"},{base:"曲",text:"ま"}], cn: "请往右转" },
      { jp: "家へ帰ります", ruby: [{base:"家",text:"いえ"},{base:"帰",text:"かえ"}], cn: "回家" }
    ]
  },
  {
    id: "n5-10",
    level: "N5",
    category: "助词",

/* ================================================================

================================================================ */
var currentView = "overview";

/* ================================================================
   工具函数
================================================================ */
function el(id) {
  return document.getElementById(id);
}

function showView(name) {
  currentView = name;
  document.querySelectorAll(".view").forEach(function(v) {
    v.classList.remove("active");
  });
  var target = el("view" + name.charAt(0).toUpperCase() + name.slice(1));
  if (target) target.classList.add("active");
  updateBackBtn();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* 返回按钮：根据当前视图逐级返回 */
function updateBackBtn() {
  var btn = el("fixedBackBtn");
  if (currentView === "overview") {
    btn.href = "/languages/";
  } else if (currentView === "catalog") {
    btn.removeAttribute("href");
  } else if (currentView === "detail") {
    btn.removeAttribute("href");
  }
}

el("fixedBackBtn").addEventListener("click", function(e) {
  if (currentView === "catalog") {
    e.preventDefault();
    showView("overview");
  } else if (currentView === "detail") {
    e.preventDefault();
    showView("catalog");
    renderCatalog();
  }
});

function getGrammarById(id) {
  for (var i = 0; i < GRAMMAR_DATA.length; i++) {
    if (GRAMMAR_DATA[i].id === id) return GRAMMAR_DATA[i];
  }
  return null;
}

function getGrammarIndex(id) {
  for (var i = 0; i < GRAMMAR_DATA.length; i++) {
    if (GRAMMAR_DATA[i].id === id) return i;
  }
  return -1;
}

/* 构建 ruby 注音 HTML */
function buildRuby(jp, rubyArr) {
  if (!rubyArr || rubyArr.length === 0) return jp;
  var result = "";
  var remaining = jp;
  var used = {};
  var i;
  for (i = 0; i < rubyArr.length; i++) {
    var r = rubyArr[i];
    var base = r.base;
    var text = r.text;
    var pos = remaining.indexOf(base);
    if (pos === -1) continue;
    result += remaining.substring(0, pos);
    result += "<ruby>" + base + "<rt>" + text + "</rt></ruby>";
    remaining = remaining.substring(pos + base.length);
  }
  result += remaining;
  return result;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ================================================================
   总览页渲染
================================================================ */
function renderOverview() {
  var grid = el("levelGrid");
  grid.innerHTML = "";
  LEVELS.forEach(function(lv) {
    var card = document.createElement("div");
    card.className = lv.available ? "level-card available" : "level-card locked";
    var count = lv.available ? GRAMMAR_DATA.length + " 条语法" : "";
    var soon = lv.available ? "" : '<span class="lv-soon">即将上线</span>';
    card.innerHTML =
      '<span class="lv-badge">' + lv.level + "</span>" +
      '<div class="lv-name">' + lv.name + "</div>" +
      '<div class="lv-desc">' + lv.desc + "</div>" +
      (count ? '<div class="lv-count">' + count + "</div>" : "") +
      soon;
    if (lv.available) {
      card.addEventListener("click", function() {
        showView("catalog");
        renderCatalog();
      });
    }
    grid.appendChild(card);
  });
}

/* ================================================================
   目录页渲染
================================================================ */
function renderCatalog() {
  renderFilters();
  renderGrammarList();
}

function renderFilters() {
  var bar = el("filterBar");
  bar.innerHTML = "";
  CATEGORIES.forEach(function(cat) {
    var tag = document.createElement("button");
    tag.className = "filter-tag" + (cat === currentFilter ? " active" : "");
    tag.textContent = cat;
    tag.addEventListener("click", function() {
      currentFilter = cat;
      renderFilters();
      renderGrammarList();
    });
    bar.appendChild(tag);
  });
}

function renderGrammarList() {
  var list = el("grammarList");
  list.innerHTML = "";
  var filtered = GRAMMAR_DATA.filter(function(g) {
    return currentFilter === "全部" || g.category === currentFilter;
  });
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">该分类下暂无语法</div>';
    return;
  }
  filtered.forEach(function(g, idx) {
    var item = document.createElement("div");
    item.className = "grammar-item";
    var num = g.id.replace("n5-", "");
    item.innerHTML =
      '<div class="gi-num">' + num + "</div>" +
      '<div class="gi-body">' +
        '<div class="gi-name jp-font">' + g.name + '<span class="cat-pill">' + g.category + "</span></div>" +
        '<div class="gi-meaning">' + g.meaning + "</div>" +
      "</div>";
    item.addEventListener("click", function() {
      currentGrammarId = g.id;
      showView("detail");
      renderDetail();
    });
    list.appendChild(item);
  });
}

/* ================================================================
   详情页渲染
================================================================ */
function renderDetail() {
  var g = getGrammarById(currentGrammarId);
  if (!g) return;
  var idx = getGrammarIndex(currentGrammarId);
  var prev = idx > 0 ? GRAMMAR_DATA[idx - 1] : null;
  var next = idx < GRAMMAR_DATA.length - 1 ? GRAMMAR_DATA[idx + 1] : null;

  renderDetailMain(g);
  renderDetailSide(g, prev, next);
}

function renderDetailMain(g) {
  var main = el("detailMain");

  /* 接续规则 */
  var connHTML = '<div class="conn-grid">';
  var connLabels = { noun: "名词", verb: "动词", i_adj: "い形容词", na_adj: "な形容词" };
  var connKeys = ["noun", "verb", "i_adj", "na_adj"];
  connKeys.forEach(function(k) {
    var val = g.connection[k];
    var isDash = val === "—";
    connHTML +=
      '<div class="conn-cell">' +
        '<div class="cc-label">' + connLabels[k] + "</div>" +
        '<div class="cc-value' + (isDash ? " dash" : "") + '">' + (isDash ? "—" : val) + "</div>" +
      "</div>";
  });
  connHTML += "</div>";

  /* 易混对比 */
  var similarHTML = "";
  if (g.similar && g.similar.length > 0) {
    similarHTML = '<div class="similar-list">';
    g.similar.forEach(function(s) {
      similarHTML +=
        '<div class="similar-row">' +
          '<div class="sr-name jp-font">' + s.name + "</div>" +
          '<div class="sr-desc">' + s.desc + "</div>" +
        "</div>";
    });
    similarHTML += "</div>";
  }

  /* 例句 */
  var exHTML = '<div class="example-list">';
  g.examples.forEach(function(ex) {
    exHTML +=
      '<div class="example-item">' +
        '<div class="example-jp jp-font">' + buildRuby(ex.jp, ex.ruby) + "</div>" +
        '<div class="example-cn">' + ex.cn + "</div>" +
      "</div>";
  });
  exHTML += "</div>";

  main.innerHTML =
    '<button class="back-btn" id="backToCatalog">← 返回目录</button>' +
    '<div class="detail-card">' +
      '<div class="detail-title">' +
        '<span class="dt-name jp-font">' + g.name + "</span>" +
        '<div class="dt-tags">' +
          '<span class="tag-pill tag-level">' + g.level + "</span>" +
          '<span class="tag-pill tag-cat">' + g.category + "</span>" +
        "</div>" +
      "</div>" +
      '<div class="detail-section">' +
        '<div class="section-label">核心含义</div>' +
        '<div class="section-text">' + g.meaning + "</div>" +
      "</div>" +
      '<div class="detail-section">' +
        '<div class="section-label">接续规则</div>' +
        connHTML +
      "</div>" +
      '<div class="detail-section">' +
        '<div class="section-label">使用场景</div>' +
        '<div class="section-text-soft">' + g.scene + "</div>" +
      "</div>" +
      '<div class="detail-section">' +
        '<div class="section-label">易错点</div>' +
        '<div class="pitfall-box">' + g.pitfalls + "</div>" +
      "</div>" +
      (similarHTML ?
        '<div class="detail-section">' +
          '<div class="section-label">易混语法对比</div>' +
          similarHTML +
        "</div>" : "") +
      '<div class="detail-section">' +
        '<div class="section-label">例句</div>' +
        exHTML +
      "</div>" +
    "</div>";

  el("backToCatalog").addEventListener("click", function() {
    showView("catalog");
    renderCatalog();
  });
}

function renderDetailSide(g, prev, next) {
  var side = el("detailSide");

  /* 接续速查 */
  var quickHTML = '<div class="side-quick">';
  var qlabels = { noun: "名词", verb: "动词", i_adj: "い形", na_adj: "な形" };
  var qkeys = ["noun", "verb", "i_adj", "na_adj"];
  qkeys.forEach(function(k) {
    var val = g.connection[k];
    var isDash = val === "—";
    quickHTML +=
      '<div class="sq-row">' +
        '<span class="sq-label">' + qlabels[k] + "</span>" +
        '<span class="sq-val' + (isDash ? " dash" : "") + '">' + (isDash ? "—" : val) + "</span>" +
      "</div>";
  });
  quickHTML += "</div>";

  /* 导航按钮 */
  var navHTML = '<div class="side-nav">';
  if (prev) {
    navHTML +=
      '<button id="navPrev">' +
        '<span class="nav-label">上一条</span>' +
        '<span class="nav-name jp-font">' + prev.name + "</span>" +
      "</button>";
  } else {
    navHTML += '<button disabled><span class="nav-label">上一条</span><span class="nav-name">—</span></button>';
  }
  if (next) {
    navHTML +=
      '<button id="navNext">' +
        '<span class="nav-label">下一条</span>' +
        '<span class="nav-name jp-font">' + next.name + "</span>" +
      "</button>";
  } else {
    navHTML += '<button disabled><span class="nav-label">下一条</span><span class="nav-name">—</span></button>';
  }
  navHTML += "</div>";

  /* 相似语法 */
  var simHTML = "";
  if (g.similar && g.similar.length > 0) {
    simHTML = "";
    g.similar.forEach(function(s) {
      /* 查找相似语法是否在数据中 */
      var match = null;
      for (var i = 0; i < GRAMMAR_DATA.length; i++) {
        if (GRAMMAR_DATA[i].name === s.name || GRAMMAR_DATA[i].name === "〜" + s.name) {
          match = GRAMMAR_DATA[i];
          break;
        }
      }
      simHTML +=
        '<div class="side-similar-link" data-sid="' + (match ? match.id : "") + '">' +
          '<div class="ssl-name jp-font">' + s.name + "</div>" +
          '<div class="ssl-desc">' + s.desc + "</div>" +
        "</div>";
    });
  }

  side.innerHTML =
    '<div class="side-card">' +
      '<div class="section-label" style="margin-bottom:12px;">接续速查</div>' +
      quickHTML +
    "</div>" +
    '<div class="side-card">' +
      '<div class="section-label" style="margin-bottom:12px;">难度等级</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<span class="tag-pill tag-level">' + g.level + "</span>" +
        '<span class="tag-pill tag-cat">' + g.category + "</span>" +
      "</div>" +
    "</div>" +
    '<div class="side-card">' +
      '<div class="section-label" style="margin-bottom:12px;">语法导航</div>' +
      navHTML +
    "</div>" +
    (simHTML ?
      '<div class="side-card">' +
        '<div class="section-label" style="margin-bottom:12px;">相似语法</div>' +
        simHTML +
      "</div>" : "");

  /* 绑定导航 */
  if (prev) {
    el("navPrev").addEventListener("click", function() {
      currentGrammarId = prev.id;
      renderDetail();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }
  if (next) {
    el("navNext").addEventListener("click", function() {
      currentGrammarId = next.id;
      renderDetail();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  /* 绑定相似语法跳转 */
  side.querySelectorAll(".side-similar-link").forEach(function(link) {
    link.addEventListener("click", function() {
      var sid = this.getAttribute("data-sid");
      if (sid) {
        currentGrammarId = sid;
        renderDetail();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  });
}

   面包屑导航
================================================================ */
el("bcHome1").addEventListener("click", function() {
  showView("overview");
});

/* ================================================================
   初始化
================================================================ */
renderOverview();
</script>
