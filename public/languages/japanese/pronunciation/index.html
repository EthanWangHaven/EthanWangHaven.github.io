<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本語の発音を楽しもう！</title>
<link rel="stylesheet" href="../../shared-theme.css" />
<style>
  :root {
    --mint: #6fc6a4;
    --mint-light: #e3f3ec;
    --mint-deep: #3f9b78;
    --mint-dark: #2f7d60;
    --highlight: #d6f0e4;
  }
  .dark {
    --mint-light: rgba(63, 155, 120, 0.15);
    --highlight: rgba(63, 155, 120, 0.12);
  }

  /* 页头 */
  .header {
    text-align: center;
    padding: 36px 20px 18px;
    position: relative;
    z-index: 1;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--mint-dark);
    letter-spacing: 1px;
  }
  .header p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-light);
  }

  /* 控制条 */
  .controls {
    max-width: 1080px;
    margin: 0 auto 14px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Tab 标签 */
  .tabs {
    display: flex;
    gap: 8px;
    background: var(--glass-bg);
    padding: 6px;
    border-radius: var(--radius-sm);
  }
  .tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 600;
    padding: 9px 22px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all .2s ease;
    font-family: inherit;
  }
  .tab.active {
    background: var(--mint-deep);
    color: #fff;
    box-shadow: 0 4px 12px rgba(63, 155, 120, 0.35);
  }
  .tab:not(.active):hover { color: var(--mint-dark); }

  /* 片假名开关 */
  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-muted);
    user-select: none;
  }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: var(--text-muted);
    border-radius: 999px;
    transition: .25s;
    cursor: pointer;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: .25s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .switch input:checked + .slider { background: var(--mint-deep); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* 内容布局：网格 + 右侧信息面板，整体居中 */
  .content-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 20px 40px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
  }
  .grid {
    flex: 0 1 720px;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
  }
  .content-wrap:not(.has-info) .grid { flex-basis: 720px; }

  /* 右侧信息面板 */
  .info-panel {
    width: 320px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow);
    padding: 24px 20px;
    min-height: 380px;
    transition: opacity .25s ease, transform .25s ease;
  }
  .info-panel.hidden {
    display: none;
  }
  .info-panel .ip-placeholder {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding-top: 120px;
    line-height: 2;
  }
  .info-panel .ip-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--glass-border);
  }
  .info-panel .ip-hira {
    font-size: 52px;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--mint-dark);
    line-height: 1;
  }
  .info-panel .ip-kata {
    font-size: 28px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text-light);
  }
  .info-panel .ip-roma {
    font-size: 16px;
    color: var(--text-muted);
    margin-left: auto;
    letter-spacing: 1px;
  }
  .info-panel .ip-section { margin-bottom: 16px; }
  .info-panel .ip-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--mint-deep);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-panel .ip-label::before {
    content: "";
    width: 3px; height: 12px;
    background: var(--mint);
    border-radius: 2px;
  }
  .info-panel .ip-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }
  .info-panel .ip-words {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .info-panel .ip-word {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
  }
  .info-panel .ip-word .w-jp {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--mint-dark);
    font-weight: 600;
    min-width: 70px;
  }
  .info-panel .ip-word .w-romaji {
    color: var(--text-muted);
    font-size: 11px;
  }
  .info-panel .ip-word .w-cn {
    color: var(--text-light);
    margin-left: auto;
  }

  /* 连读按钮 */
  .btn-readall {
    border: none;
    background: var(--mint-deep);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all .2s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-readall:hover { background: var(--mint-dark); }
  .btn-readall.reading {
    background: var(--text-muted);
    cursor: not-allowed;
    opacity: 0.6;
  }
  .btn-readall .play-ico {
    width: 0; height: 0;
    border-left: 7px solid #fff;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }

  /* 卡片悬停高亮 */
  .card.hovered {
    border-color: var(--mint);
    box-shadow: 0 0 0 2px rgba(111, 198, 164, 0.3), var(--shadow-hover);
  }

  /* 卡片 */
  .card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 18px 10px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--glass-shadow);
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .card.active {
    transform: scale(0.94);
    background: var(--highlight);
    box-shadow: var(--shadow-hover);
  }
  .kana-ja {
    font-size: 38px;
    line-height: 1.1;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
    color: var(--mint-dark);
  }
  .kana-kata {
    font-size: 22px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
    color: var(--text-light);
    transition: opacity .2s ease, height .2s ease, margin .2s ease;
  }
  .kana-romaji {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--text-muted);
    text-transform: lowercase;
  }
  body.hide-kata .kana-kata {
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
  }

  /* 行标题（浊音/拗音分组） */
  .row-label {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--text-light);
    margin: 14px 0 -4px 2px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row-label::before {
    content: "";
    width: 4px; height: 14px;
    background: var(--mint);
    border-radius: 2px;
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
  }

  /* 语音状态提示 */
  .voice-tip {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .voice-tip .tip-box {
    display: none;
    margin-top: 4px;
    padding: 8px 14px;
    font-size: 12px;
    color: #8a6d3b;
    background: #fdf6e3;
    border: 1px solid #f0e3c2;
    border-radius: var(--radius-xs);
  }

  /* 默写模式：隐藏卡片内容 */
  body.write-mode .kana-ja,
  body.write-mode .kana-kata,
  body.write-mode .kana-romaji { opacity: 0; }
  body.write-mode .card:hover .kana-ja,
  body.write-mode .card:hover .kana-kata,
  body.write-mode .card:hover .kana-romaji { opacity: 0; }

  @media (max-width: 600px) {
    .header h1 { font-size: 23px; }
    .content-wrap { padding: 10px 14px 40px; }
    .grid { flex-basis: 100% !important; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    .kana-ja { font-size: 32px; }
    .controls { padding: 0 14px; }
    .tab { padding: 8px 16px; font-size: 14px; }
  }
</style>
</head>
<body>

        <span class="switch">
          <input type="checkbox" id="writeToggle" />
          <span class="slider"></span>
        </span>
      </label>

        <span class="play-ico"></span>连读
      </button>
    </div>
  </div>

  <div class="voice-tip">
    <div class="tip-box" id="voiceTip"></div>
  </div>

  <div class="content-wrap has-info" id="contentWrap">
    <main class="grid" id="grid"></main>
    <aside class="info-panel" id="infoPanel">
      <div class="ip-placeholder">将鼠标悬停在假名卡片上<br>查看详细信息</div>
    </aside>
  </div>

/* ============ 假名详细信息（汉字起源/口诀/发音/示例词） ============ */
const KANA_INFO = {
  "あ": {origin:"安 的草书；片假名ア取自阿的左耳旁",mnemonic:"啊(a)一声，安心的安",pronounce:"嘴巴自然张开，发音类似中文啊",words:[["あい","ai","爱"],["あさ","asa","早晨"]]},
  "い": {origin:"以 的草书；イ取自伊单人旁",mnemonic:"衣(i)，以的草书",pronounce:"嘴角微展，发音类似衣",words:[["いぬ","inu","狗"],["いち","ichi","一"]]},
  "う": {origin:"宇 的草书；ウ取自宇宝盖头",mnemonic:"乌(u)，宇的宝盖头",pronounce:"嘴不用撅太圆，介于u和yu之间",words:[["うみ","umi","海"],["うえ","ue","上面"]]},
  "え": {origin:"恵 的草书；エ取自恵上部",mnemonic:"诶(e)，惠的上半部",pronounce:"嘴巴微扁，发音类似诶",words:[["えき","eki","车站"],["え","e","画"]]},
  "お": {origin:"於 的草书；オ取自於左上角",mnemonic:"喔(o)，於的左上角",pronounce:"嘴唇收圆，发音类似哦",words:[["おちゃ","ocha","茶"],["おと","oto","声音"]]},
  "か": {origin:"加 的草书；カ取自加左边力字旁",mnemonic:"加的力字旁，ka",pronounce:"k加a，词首送气，词中不送气",words:[["かさ","kasa","伞"],["かぜ","kaze","风"]]},
  "き": {origin:"幾 的草书；キ取自幾的上部",mnemonic:"幾的上部，ki",pronounce:"k加i，类似key",words:[["きつつき","kitsutsuki","啄木鸟"],["きかい","kikai","机械"]]},
  "く": {origin:"久 的草书；ク取自久右侧笔画",mnemonic:"久的右侧，ku",pronounce:"k加u，类似库",words:[["くも","kumo","云"],["くち","kuchi","嘴"]]},
  "け": {origin:"計 的草书；ケ取自計右边部件",mnemonic:"計的右边，ke",pronounce:"k加e，类似凯",words:[["けむり","kemuri","烟"],["けさ","kesa","今天早上"]]},
  "こ": {origin:"古 的草书；コ取自古上半部分",mnemonic:"古的上半，ko",pronounce:"k加o，类似扣",words:[["こころ","kokoro","心"],["こめ","kome","米"]]},
  "さ": {origin:"左 的草书；サ取自左上部",mnemonic:"左的上部，sa",pronounce:"s加a，类似萨",words:[["さかな","sakana","鱼"],["さくら","sakura","樱花"]]},
  "し": {origin:"之 的草书；シ取自之变形",mnemonic:"之的变形，shi",pronounce:"发音xi，不是si！类似西",words:[["しま","shima","岛"],["しお","shio","盐"]]},
  "す": {origin:"須 的草书；ス取自須偏旁",mnemonic:"须的偏旁，su",pronounce:"发音介于si和su之间",words:[["すし","sushi","寿司"],["すい","sui","水"]]},
  "せ": {origin:"世 的草书；セ取自世简化",mnemonic:"世的简化，se",pronounce:"s加e，类似塞",words:[["せかい","sekai","世界"],["せんせい","sensei","老师"]]},

let currentTab = "seion";

function render(tab) {
  grid.innerHTML = "";
  const groups = DATA[tab];
  if (!groups) { grid.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  groups.forEach(group => {
    const label = document.createElement("div");
    label.className = "row-label";
    label.textContent = group.row;
    grid.appendChild(label);
    group.items.forEach(([hira, kata, roma]) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.text = hira;
      card.dataset.roma = roma;
      card.innerHTML =
        '<div class="kana-ja">' + hira + '</div>' +
        '<div class="kana-kata">' + kata + '</div>' +
        '<div class="kana-romaji">' + roma + '</div>';
      card.addEventListener("click", () => speak(card, roma));
      card.addEventListener("mouseenter", () => showInfo(card, hira));
      grid.appendChild(card);
    });
  });
}

/* ============ 信息面板 ============ */
const infoPanel = document.getElementById("infoPanel");
const contentWrap = document.getElementById("contentWrap");
let infoEnabled = true;

function showInfo(card, hira) {
  if (!infoEnabled) return;
  if (document.body.classList.contains("write-mode")) return;
  document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
  card.classList.add("hovered");

  const info = KANA_INFO[hira];
  if (!info) return;
  const roma = card.dataset.roma;
  const kata = card.querySelector(".kana-kata") ? card.querySelector(".kana-kata").textContent : "";

  let wordsHTML = "";
  if (info.words && info.words.length) {
    wordsHTML = info.words.map(w =>
      '<div class="ip-word"><span class="w-jp">' + w[0] + '</span><span class="w-romaji">' + w[1] + '</span><span class="w-cn">' + w[2] + '</span></div>'
    ).join("");
  }

  infoPanel.innerHTML =
    '<div class="ip-header">' +
      '<span class="ip-hira">' + hira + '</span>' +
      '<span class="ip-kata">' + kata + '</span>' +
      '<span class="ip-roma">' + roma + '</span>' +
    '</div>' +
    '<div class="ip-section"><div class="ip-label">汉字起源</div><div class="ip-text">' + info.origin + '</div></div>' +
    '<div class="ip-section"><div class="ip-label">记忆口诀</div><div class="ip-text">' + info.mnemonic + '</div></div>' +
    '<div class="ip-section"><div class="ip-label">发音要点</div><div class="ip-text">' + info.pronounce + '</div></div>' +
    (wordsHTML ? '<div class="ip-section"><div class="ip-label">示例单词</div><div class="ip-words">' + wordsHTML + '</div></div>' : '');
}

/* ============ 语音播放（本地音频文件） ============ */
const voiceTip = document.getElementById("voiceTip");
let currentAudio = null;

function speak(card, roma) {
  // 点击反馈
  card.classList.add("active");
  setTimeout(() => card.classList.remove("active"), 260);

  const url = "audio/" + roma + ".mp3";
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    currentAudio = new Audio(url);
    currentAudio.play().catch(err => {
      voiceTip.style.display = "block";
      voiceTip.textContent = "音频加载失败：" + roma + " (" + err.message + ")";
    });
  } catch (e) {
    voiceTip.style.display = "block";
    voiceTip.textContent = "播放出错：" + e.message;
  }
}

/* ============ 交互绑定 ============ */
const btnReadAll = document.getElementById("btnReadAll");
let isReading = false;

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.tab;
    render(currentTab);
    if (isReading) stopReadAll();
  });
});

document.getElementById("kataToggle").addEventListener("change", e => {
  document.body.classList.toggle("hide-kata", !e.target.checked);
});

document.getElementById("infoToggle").addEventListener("change", e => {
  infoEnabled = e.target.checked;
  if (infoEnabled) {
    infoPanel.classList.remove("hidden");
    contentWrap.classList.add("has-info");
  } else {
    infoPanel.classList.add("hidden");
    contentWrap.classList.remove("has-info");
    document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
  }
});

document.getElementById("writeToggle").addEventListener("change", e => {
  document.body.classList.toggle("write-mode", e.target.checked);
  if (e.target.checked) {
    document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
    if (infoPanel) infoPanel.innerHTML = '<div class="ip-placeholder">默写模式已开启<br>卡片内容已隐藏</div>';
  }
});

/* ============ 连读功能 ============ */

function playOne(roma) {
  return new Promise(resolve => {
    const audio = new Audio("audio/" + roma + ".mp3");
    audio.addEventListener("ended", resolve);
    audio.addEventListener("error", resolve);
    audio.play().catch(resolve);
  });
}

async function startReadAll() {
  if (isReading) return;
  isReading = true;
  btnReadAll.classList.add("reading");
  btnReadAll.innerHTML = '<span class="play-ico"></span>朗读中...';
  const cards = [...document.querySelectorAll("#grid .card")];
  for (let i = 0; i < cards.length; i++) {
    if (!isReading) break;
    const card = cards[i];
    card.classList.add("hovered");
    showInfo(card, card.dataset.text);
    await playOne(card.dataset.roma);
    card.classList.remove("hovered");
  }
  isReading = false;
  btnReadAll.classList.remove("reading");
  btnReadAll.innerHTML = '<span class="play-ico"></span>连读';
}

function stopReadAll() {
  isReading = false;
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  btnReadAll.classList.remove("reading");
  btnReadAll.innerHTML = '<span class="play-ico"></span>连读';
  document.querySelectorAll(".card.hovered").forEach(c => c.classList.remove("hovered"));
}

btnReadAll.addEventListener("click", () => {
  if (isReading) stopReadAll(); else startReadAll();
});

render(currentTab);
</script>
